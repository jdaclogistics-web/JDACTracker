name: Phone app live update
# main पर mobile/shared बदलते ही web bundle बनाकर branch "live" पर डालता है.
# Phones app खुलने पर version.json देखकर नया bundle खुद ले लेते हैं (APK दोबारा नहीं).
on:
  push: { branches: [main], paths: ['mobile/**', 'shared/**', 'web/src/**', 'web/public/**', '.github/workflows/live-update.yml'] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: live-update, cancel-in-progress: true }
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: mobile
        run: |
          (for i in 1 2 3 4; do npm install --no-audit --no-fund && exit 0; echo retry $i; sleep 20; done; exit 1)
          VITE_BUILD="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" npm run build
          echo "VER=$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Publish to branch live
        run: |
          mkdir -p /tmp/live && cd mobile/dist && zip -qr /tmp/live/bundle-$VER.zip . && cd /tmp/live
          echo "{\"version\":\"$VER\",\"url\":\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/live/bundle-$VER.zip\"}" > version.json
          git init -q -b live && git add . && git -c user.name=jdac-bot -c user.email=bot@users.noreply.github.com commit -qm "live $VER"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live
