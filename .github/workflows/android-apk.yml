name: Android APK
on:
  push: { branches: [main], paths: ['mobile/**', 'shared/**', '.github/workflows/android-apk.yml'] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
        env: { VITE_API_URL: '${{ vars.API_URL }}' }
      - run: node scripts/android-init.mjs
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: JDAC-Tracker-apk, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk }
