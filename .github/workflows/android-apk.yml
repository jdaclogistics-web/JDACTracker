name: Android APK
# हर बदलाव पर APK बनाकर GitHub Release "apk-latest" में डालता है —
# phone पर सीधा link: https://github.com/jdaclogistics-web/JDACTracker/releases/download/apk-latest/JDAC-Tracker.apk
on:
  push: { branches: [main], paths: ['mobile/**', 'shared/**', 'web/src/**', 'web/public/**', '.github/workflows/android-apk.yml'] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: (for i in 1 2 3 4; do npm install --no-audit --no-fund && exit 0; echo retry $i; sleep 20; done; exit 1)
      - run: VITE_BUILD="apk-$(date -u +%Y%m%d%H%M)" npm run build
      - run: node scripts/android-init.mjs
      # हमेशा एक ही key से sign → नया APK पुराने के ऊपर install हो जाता है (uninstall नहीं करना पड़ता)
      - run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/mobile/keystore/jdac-app.jks \
            -Pandroid.injected.signing.store.password=jdacapp123 \
            -Pandroid.injected.signing.key.alias=jdac \
            -Pandroid.injected.signing.key.password=jdacapp123
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/JDAC-Tracker.apk
      - name: Publish release apk-latest
        working-directory: .
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest JDAC-Tracker.apk --title "JDAC Tracker — latest APK" --notes "Built from ${GITHUB_SHA::7} on $(date -u +'%d %b %Y %H:%M') UTC. Phone पर download करके install करें."
