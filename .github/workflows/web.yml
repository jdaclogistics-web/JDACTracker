name: Admin web (GitHub Pages)
on:
  push: { branches: [main], paths: ['web/**', 'mobile/src/**', 'mobile/public/**', 'mobile/index.html', 'shared/**', '.github/workflows/web.yml'] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm install && npm run build
        env: { VITE_API_URL: '${{ vars.API_URL }}' }
      # Employee app का web version → /JDACTracker/app/ (APK जैसा ही, browser में)
      - run: cd mobile && npm install && npx vite build --outDir ../web/dist/app --emptyOutDir false
        env: { VITE_API_URL: '${{ vars.API_URL }}' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
