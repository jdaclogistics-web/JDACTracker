name: Admin web (GitHub Pages)
on:
  push: { branches: [main], paths: ['web/**', 'mobile/src/**', 'mobile/public/**', 'mobile/index.html', 'shared/**', '.github/workflows/web.yml'] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && (for i in 1 2 3 4; do npm install && exit 0; sleep 20; done; exit 1) && npm run build
        env: { VITE_API_URL: '${{ vars.API_URL }}' }
      # New JDAC Parent design → main link /JDACTracker/ ; old admin panel (real attendance data) → /JDACTracker/old/
      - run: |
          cd web
          mv dist old && mkdir dist && mv old dist/old
          mv dist/old/f dist/f
          cp dist/old/parent/index.html dist/index.html && rm -rf dist/old/parent
          cp dist/old/*.png dist/ 2>/dev/null || true
      # Employee app का web version → /JDACTracker/app/ (APK जैसा ही, browser में)
      - run: cd mobile && (for i in 1 2 3 4; do npm install && exit 0; sleep 20; done; exit 1) && npx vite build --outDir ../web/dist/app --emptyOutDir false
        env: { VITE_API_URL: '${{ vars.API_URL }}' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
