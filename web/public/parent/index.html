<html lang="en">

<title>JDAC Sales · Team App</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a food-delivery app for running five companies — friendly, quick, one thing per card
   IDEA: every screen behaves like Swiggy/Zomato: categories as circles, cards with one big button, order-tracker steps
   PICTURE: the home "Needs you" carousel and the content calendar's date strip
   COLOUR and TYPE: white cards on soft grey, JDAC navy for text, Swiggy orange for actions, green done, red late; Outfit + Inter
   LAYOUT: one centred column (max 1080px), sticky header, bottom tab bar on phones, top tabs on desktop, bottom sheets for detail */
:root{--o:#24408E;--o2:#1B3170;--oL:#EEF2FB;--h:#F26A1B;--h2:#d95a10;--hL:#FFF1E8;--navy:#02496A;--ink:#1B1E24;--mut:#6B6E7A;--bg:#F2F3F5;--card:#fff;--line:#E8E9EC;--g:#139B5F;--gL:#E6F6EE;--r:#E03A3E;--rL:#FDECEC;--a:#B86A00;--aL:#FFF4E0;--b:#2563C9;--bL:#E9F0FD;--p:#7A2E8E;--pL:#F4E9F7;--t:#0796A6;--tL:#E3F5F7;--sh:0 2px 10px rgba(20,30,50,.06)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:clip}

h1{font-size:26px;font-weight:800;line-height:1.1}h2{font-size:20px;font-weight:700}h3{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;background:#fff;font-size:16px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--o);outline:none}
:focus-visible{outline:3px solid rgba(36,64,142,.4);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:none;margin:0 auto;padding:0 16px}@media(min-width:821px){.wrap{padding:0 24px}}
.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nw{flex-wrap:nowrap}

/* header */
.hd{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}

.tnav button:hover{background:var(--bg)}
.tnav button.on{color:var(--o);background:var(--oL)}
.proto{font-size:11px;font-weight:700;color:var(--a);background:var(--aL);border-radius:20px;padding:3px 9px;white-space:nowrap}
main{padding:16px 0 140px}

.who b{white-space:nowrap}
.btn.r{background:var(--r)}
.post.late{box-shadow:0 0 0 2px var(--r) inset,var(--sh)}
.post button.th{cursor:pointer;text-align:left}

.ment{color:#027EB5;font-weight:600}

.compose.wa{background:#F0F2F5;border-radius:28px;padding:4px;align-items:center;gap:2px}.compose.wa input{border:0;background:#fff;border-radius:22px;min-height:42px}
.emo{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border-radius:16px;padding:8px;margin-top:8px;box-shadow:var(--sh)}.emo[hidden]{display:none}.emo button{border:0;background:none;font-size:22px;width:40px;height:40px;border-radius:10px;cursor:pointer}.emo button:hover{background:var(--bg)}.emo.big{justify-content:center;box-shadow:none}.emo.big button{font-size:28px;width:48px;height:48px}
.ment-s{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ment-s button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px 4px 4px;font-weight:600;cursor:pointer}
.rbar{display:flex;align-items:center;gap:8px;background:#fff;border-left:4px solid #00A884;border-radius:10px;padding:6px 10px;margin-top:8px;font-size:13px}.rbar div{flex:1}.rbar b{display:block;color:#00A884;font-size:12px}
.recbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin-top:8px;font-weight:600}.rdot{width:10px;height:10px;border-radius:50%;background:var(--r);animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.ubdg{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:#25D366;color:#fff;font-size:11px;font-weight:700;padding:0 5px;margin-top:4px;margin-left:3px}
.waTools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;padding:8px 10px;border-bottom:1px solid var(--line)}.waTools select{width:auto;min-height:34px}
.lab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}.lab.on{background:#E7F8EE;border-color:#25D366;color:#0b7a3e}.lab.sm{font-size:10.5px;padding:1px 7px;cursor:default}
.wnote{align-self:center;max-width:88%;background:#FFF4C2;border:1px dashed #E6A23C;border-radius:10px;padding:7px 10px;font-size:13.5px}.wnote b{display:block;font-size:11.5px;color:#8a5a00}.wnote span{display:block;text-align:right;font-size:11px;color:var(--mut)}
.xsheet{background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:auto;max-height:70vh;border:1px solid var(--line)}

.xsheet td.n{text-align:center;font-variant-numeric:tabular-nums}.xsheet td.n.g{color:var(--g)}.xsheet td.n.r{color:var(--r)}.xsheet td.n.a{color:var(--a)}.xsheet td.n.b{color:var(--b)}
.ac{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:6px;border:0;font:700 10.5px Inter;background:var(--bg);color:var(--mut);cursor:pointer}.ac:disabled{cursor:default;background:none;color:#ccc}
.ac.sm{width:26px;height:20px;font-size:9.5px;cursor:default}
.ac.P{background:var(--gL);color:var(--g)}.ac.L{background:var(--bL);color:var(--b)}.ac.HD{background:var(--hL);color:var(--h2)}.ac.A,.ac.NS{background:var(--rL);color:var(--r)}.ac.LV{background:var(--bL);color:var(--b)}.ac.WO{background:#ECEDF0;color:var(--mut)}.ac.H{background:var(--pL);color:var(--p)}
.eid{font:700 12px ui-monospace,Menlo,monospace;color:#2B4C9B;background:#EEF2FB;border-radius:6px;padding:3px 7px}
.tgl{border:1px solid var(--line);background:var(--aL);color:var(--a);border-radius:14px;padding:3px 10px;font-weight:600;font-size:12px;cursor:pointer}.tgl.on{background:var(--gL);color:var(--g);border-color:transparent}
.ibtn.eye{font:inherit}.ibtn.eye .ico{width:16px;height:16px}
.org{display:flex;align-items:center;gap:10px;padding:8px 0;border-left:2px solid var(--line);padding-left:10px}.org>div:nth-child(2){flex:1}
.slip{border:1px solid var(--line);border-radius:14px;padding:16px}.slip table{width:100%;border-collapse:collapse}.slip td{padding:8px 0;border-top:1px solid var(--line)}.slip td+td{text-align:right;font-weight:700}
.sheet.wide{max-width:860px}

.ss-sig{padding:14px 16px}.ss-sig small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:#555}.ss-sig img{height:60px;margin:8px 0 4px;display:block}.ss-line{height:60px;width:180px;border-bottom:1px solid #999;margin-bottom:6px}.ss-sig b{font-size:13px}

@media(max-width:700px){.sheet.wide .ss{transform-origin:top left}.sheet.wide{overflow-x:auto}}
.wrap.wide{max-width:none;padding:0 20px}
@media(min-width:821px){.wrap.wide .xsheet{max-height:calc(100vh - 250px)}.wrap.wide .xsheet.master td,.wrap.wide .xsheet.master th{padding:6px 5px;font-size:12px}.wrap.wide .xsheet.master td.stk span{font-size:11px}.wrap.wide .xsheet.master .av{width:28px;height:28px;font-size:11px}.wrap.wide .xsheet.master .tgl{padding:2px 7px;font-size:11px}.wrap.wide .xsheet.master .pill{font-size:11px;padding:2px 7px}.wrap.wide .xsheet.master .ibtn{width:26px;height:26px}.wrap.wide .xsheet.master th{font-size:10.5px}}

const nid=p=>p+Math.random().toString(36).slice(2,8);
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
const COLS=['#02496A','#0796A6','#6E0F7A','#137a50','#9a5f00','#1d62c4','#8e3b46','#3d5a80'];

A.punch=()=>{CART={r:'',items:{},rates:{},note:''};punchSheet()};
function punchSheet(){const n=Object.values(CART.items).reduce((a,b)=>a+b,0),rt=p=>CART.rates[p]!=null?CART.rates[p]:prd(p).rate,tot=Object.entries(CART.items).reduce((a,[p,q])=>a+q*rt(p),0);const r=D.retail.find(x=>x.id===CART.r),blk=r&&r.out&&-daysTo(r.since)>30,loss=Object.keys(CART.items).some(p=>rt(p)<prd(p).cost);
 sheet(`<h2>New order</h2><label for="pcr">Shop</label><select id="pcr" data-ch="pcr"><option value="">Choose shop…</option>${D.retail.map(x=>`<option value="${x.id}" ${CART.r===x.id?'selected':''}>${h(x.n)} · ${h(x.city)}</option>`).join('')}</select><button class="lnk" data-a="retNew">+ New shop</button>
 ${blk?`<div class="note" style="border-color:var(--r);color:var(--r)">Bill older than 1 month — you can punch, but delivery waits for payment.</div>`:r&&r.out?`<div class="note">Due: ${inr(r.out)}</div>`:''}
 <div>${D.prod.map(p=>{const q=CART.items[p.id]||0,avl=D.inv.goa[p.id]-reserved('goa',p.id);return `<div class="dish"><div style="flex:1"><b>${h(p.n)}</b><div class="row nw" style="gap:6px;margin:4px 0"><span class="sm mut">₹</span><input type="number" value="${rt(p.id)}" data-ch="pcrate" data-p="${p.id}" style="width:90px;min-height:34px;padding:4px 8px;font-weight:700" aria-label="Rate for ${h(p.n)}"></div><div class="xs mut">${avl} in Goa · ${avl<=0?'Nashik will ship':''}</div></div><div class="ph">GOVAA${q?`<div class="qty"><button data-a="pcq" data-p="${p.id}" data-n="-1" aria-label="Less">−</button><span>${q}</span><button data-a="pcq" data-p="${p.id}" data-n="1" aria-label="More">+</button></div>`:`<button class="add" data-a="pcq" data-p="${p.id}" data-n="1">ADD</button>`}</div></div>`}).join('')}</div>
 ${loss?`<div class="note" style="color:var(--r)">A rate is below cost — this shows as a loss in Accounts.</div>`:''}
 <label for="pcn">Offer / note</label><input id="pcn" data-ch="pcn" value="${h(CART.note)}" placeholder="e.g. 10 + 1 free">
 ${n?`<div class="cart"><div><b>${n} item${n>1?'s':''} · ${inr(tot)}</b><div class="xs" style="opacity:.85">Stock held on save · GST invoice auto</div></div><span class="sp"></span><button data-a="pcSave">Place order →</button></div>`:''}`)}

 D.gbo.push({id:no,r:CART.r,src:S.me==='atmaram'?'Atmaram':'Admin',wh:goaOk?'goa':'nashik',items:CART.items,rates:CART.rates,note:CART.note,loss,st:'Punched',pay:'',at:TODAY});D.targets.find(x=>x.id==='t5').v+=tot;addV({ty:'Sale',co:'gb',party:rName(CART.r),amt:tot,gst:18,mode:'Credit',by:'System',st:'Verified',src:'Order '+no+(loss?' · below cost':''),paid:0});save();closeM();render();toast(no+' placed · '+inr(tot)+(goaOk?'':' · ships from Nashik'))};

let STREAM=null;function stopCam(){if(STREAM){STREAM.getTracks().forEach(t=>t.stop());STREAM=null}}
A.clock=async()=>{const a=D.att.find(x=>x.k===S.me);if(a&&a.in&&!a.out){a.out=new Date().toTimeString().slice(0,5);save();render();return toast('Clocked out at '+a.out)}
 const w=document.getElementById('camwrap');if(!w){S.v='me';render();return}w.innerHTML=`<div style="margin-top:12px"><video id="vid" autoplay playsinline muted style="width:100%;max-width:300px;border-radius:16px;background:#000"></video><button class="btn w" style="margin-top:10px" data-a="snap">${ic('cam')}Take selfie & clock in</button><div class="xs mut" id="gps" style="margin-top:6px">Checking location…</div></div>`;
 try{STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('vid').srcObject=STREAM}catch(x){const v=document.getElementById('vid');if(v)v.outerHTML='<div class="note">Camera opens in the real app (front camera only, no uploads).</div>'}
 try{navigator.geolocation.getCurrentPosition(p=>{const d=dist(p.coords.latitude,p.coords.longitude,18.4975,73.8983),g=document.getElementById('gps');if(g)g.textContent=(typeof empOf==='function'&&(empOf(S.me)||{}).anyLoc)?'Location stamped · allowed to mark from anywhere':d<=200?'Inside office area':'Away from office · counts as field / WFH'},()=>{const g=document.getElementById('gps');if(g)g.textContent='Turn location on to clock in'})}catch(x){}};
function dist(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180;const x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function parseVcfText(t){return t.replace(/\r?\n[ \t]/g,'').split(/END:VCARD/i).map(b=>{const g=re=>((b.match(re)||[])[1]||'').trim();const adr=g(/\nADR[^:]*:([^\r\n]*)/i).split(';');const geo=g(/\nGEO[^:]*:([^\r\n]*)/i).replace(/^geo:/i,'').split(/[;,]/);const url=g(/\nURL[^:]*:([^\r\n]*)/i);const gm=parseMaps(url)||(geo.length===2&&!isNaN(+geo[0])&&geo[0]?{lat:+geo[0],lng:+geo[1]}:null);
 return {n:g(/\nFN[^:]*:([^\r\n]*)/i)||g(/\nN[^:]*:([^\r\n]*)/i).split(';').reverse().join(' ').trim(),org:g(/\nORG[^:]*:([^\r\n]*)/i).split(';')[0],ph:g(/\nTEL[^:]*:([^\r\n]*)/i),email:g(/\nEMAIL[^:]*:([^\r\n]*)/i),role:g(/\nTITLE[^:]*:([^\r\n]*)/i),addr:adr.slice(2,3).join(''),city:adr[3]||'',lat:gm?gm.lat:null,lng:gm?gm.lng:null,maps:gm?'':url}}).filter(x=>x.n&&x.ph)}
function parseCsvText(t){const rows=t.trim().split(/\r?\n/).map(l=>{const o=[];let cur='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(cur);cur=''}else cur+=ch}o.push(cur);return o.map(s=>s.trim())});const hd=rows[0].map(x=>x.toLowerCase());const ix=k=>hd.findIndex(x=>k.some(y=>x.includes(y)));const I0={n:ix(['name']),org:ix(['company','org','carrier']),ph:ix(['phone','mobile','number']),email:ix(['email','mail']),role:ix(['role','title','designation']),city:ix(['city']),maps:ix(['map','location','link'])};
 return rows.slice(1).map(r=>{const o={};for(const k in I0)o[k]=I0[k]>=0?r[I0[k]]||'':'';const g=parseMaps(o.maps);if(g){o.lat=g.lat;o.lng=g.lng;o.maps=''}else{o.lat=null;o.lng=null}return o}).filter(x=>x.n&&x.ph)}
function importContacts(list){const ty=pick1('cimt')||'Carrier',org=val('cimo'),co=val('cimc')||'log';const have=new Set(allContacts().map(c=>telOf(c.ph).slice(-10)));let add=0,skip=0;
 list.forEach(x=>{const k=telOf(x.ph).slice(-10);if(!k||have.has(k)){skip++;return}have.add(k);D.contacts.push(Object.assign({id:nid('ct'),type:ty,co,role:x.role||'Other',area:'',hours:'',tags:['Imported'],note:'',by:S.me,at:TODAY,email:'',addr:'',city:''},x,{org:x.org||org||'—'}));add++});save();return [add,skip]}

 sheet(`<div class="slip"><div class="row nw"><b style="font:800 18px Outfit;flex:1">JDAC Sales Pvt Ltd</b><span class="xs mut">Salary slip · ${new Date(s+'T12:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span></div><div class="row" style="margin:10px 0"><span><b>${h(x.n)}</b> · ${x.id}</span><span class="sp"></span><span class="sm">${h(x.desig)}</span></div><table>${[['Monthly in-hand',x.sal?inr(x.sal):'Not set'],['Days in month',dim],['Payable days',pay],['Present / late / half',`${c.P} / ${c.L} / ${c.HD}`],['Absent',c.A],['Late cut (3 lates = ½ day)',c.lateCut],['Salary earned',inr(g)]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div><button class="btn sec w" style="margin-top:12px" data-a="toast" data-t="Slip shared on the employee's app (on request only)">Send to employee</button>`)};
async function saveFile(name,text){try{if(DLNS){await DLNS.save({filename:name,data:new Blob([text],{type:'text/csv'})});toast('Saved '+name);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click();toast('Downloaded '+name)}catch(x){toast('Save was cancelled or is not available here')}}

A.empXls=()=>saveFile('Employee_master.csv',csv([['Emp ID','Name','Unit','Status','Designation','Joining','Exit','Contact','Time','City','Salary/month','LPA','Offer letter','Appointment letter','Documents','Tracker login'],...D.emp.map(e=>[e.id,e.n,e.unit,e.st,e.desig,e.doj,e.dox,e.ph,e.time,e.city,e.sal||'',e.sal?(e.sal*12/100000).toFixed(2):'',e.offer,e.appt,e.docs,e.login])]));
A.attXls=()=>{const s=S.av==='day'?(S.ad||TODAY):S.av==='week'?wkStart(S.ad||TODAY):monStart(S.ad||TODAY),en=S.av==='day'?s:S.av==='week'?addD(s,6):monEnd(S.ad||TODAY),days=[];for(let d=s;d<=en;d=addD(d,1))days.push(d);saveFile('Attendance_'+s+'_to_'+en+'.csv',csv([['Emp ID','Name',...days,'P','HD','L','A'],...D.emp.filter(e=>e.st!=='Exited').map(e=>{const c=attSum(e,s,en);return [e.id,e.n,...days.map(d=>{const s=attOf(e,d);return s==='WO'||s==='H'?'L':s}),c.P,c.HD,c.L+c.WO+c.H,c.A]})]))};
A.payXls=()=>{const s=S.pm,en=monEnd(s),dim=+en.slice(8);saveFile('Payroll_'+s.slice(0,7)+'.csv',csv([['Emp ID','Name','In-hand','Payable days','Salary earned'],...D.emp.filter(e=>e.st!=='Exited').map(e=>{const c=attSum(e,s,en),pay=Math.min(dim,c.days+c.WO+c.H);return [e.id,e.n,e.sal||'',pay,e.sal?Math.round(e.sal/dim*pay):'']})]))};
document.addEventListener('change',e=>{if(e.target.dataset.ch!=='empUp')return;const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const rows=String(r.result).trim().split(/\r?\n/).map(l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())});const hd=rows[0].map(x=>x.toLowerCase());const ix=k=>hd.findIndex(x=>x.includes(k));let add=0,upd=0;
 rows.slice(1).forEach(rw=>{const g=k=>ix(k)>=0?rw[ix(k)]:'';const name=g('name');if(!name)return;const id=g('emp id')||g('id');let x=id&&D.emp.find(y=>y.id===id);const o={n:name,desig:g('designation')||'—',unit:g('unit')||g('designation')||'—',st:g('status')||'Active',doj:g('joining')||TODAY,dox:g('exit'),ph:g('contact')||g('phone')||'—',time:g('time')||SHIFT.ho,city:g('city')||'Pune HO',sal:+g('salary')||null};if(x){Object.assign(x,o);upd++}else{D.emp.push(Object.assign({id:nextEmpId(),k:null,offer:'Pending',appt:'Pending',docs:'Pending',login:'Not yet',lead:'nameera'},o));add++}});save();render();toast(`Sheet read · ${add} added · ${upd} updated`)};r.readAsText(f)});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(k==='lpaPrev'){const o=document.getElementById('ef-lpa');if(o)o.textContent=lpa(+e.target.value);return}if(!['aq','mq'].includes(k))return;S[k]=e.target.value;const p=e.target.selectionStart;render();const i=document.getElementById(k);if(i){i.focus();i.setSelectionRange(p,p)}});

const dayIdx=()=>{const d=new Date(TODAY+'T12:00:00'),s0=new Date(d.getFullYear(),0,0);return Math.floor((d-s0)/864e5)};
const _homeGX=V.home;V.home=()=>{const o=_homeGX(),sl=SLOGANS[dayIdx()%SLOGANS.length],d=new Date(TODAY+'T12:00:00');
 const dt=`<span class="gday">${d.toLocaleDateString('en-IN',{weekday:'long'})}</span><span class="gdate">${d.getDate()} ${d.toLocaleDateString('en-IN',{month:'long'})} ${d.getFullYear()}</span>`;
 return o.replace(/<div class="greet"><h1>[^<]*<\/h1><p>[\s\S]*?<\/p><\/div>/,`<div class="greet greetR"><div class="gdt">${dt}</div><h1>“${h(sl)}”</h1></div>`)};
/* ---- Tasks: no visible scrollbars ---- */
const _rTasksX=render;render=function(){_rTasksX.apply(this,arguments);try{document.documentElement.classList.toggle('v-tasks',S.v==='tasks')}catch(e){}};
/* ---- Tasks → Meetings: no second "Tasks" heading, no dead List/Board/Calendar buttons ---- */
const _vtMeetX=V.tasks;V.tasks=()=>{let o=_vtMeetX();if(S.ttab==='meet'){o=o.replace(/<div class="row nw" style="margin-bottom:14px"><div style="flex:1"><h1>Tasks<\/h1>[\s\S]*?<\/div>(<[^>]*>)?<\/div>/,'').replace(/<div class="chips" role="tablist">(?:<button[^>]*data-a="tv"[\s\S]*?<\/button>)+<\/div>/,'')}
 if(S.ttab==='time')o=o.replace(/<div class="tppl">[\s\S]*?<\/div><\/div><\/div>/,'');return o};

/* ---- Tasks → Timeline v3: date bar, Day list, Project / Person filters, edit dates ---- */
const TLV={d:1,'1w':7,'2w':14,m:31};
const tlFrom=()=>{const v=S.tlv||'2w';if(v==='d')return S.tld||TODAY;return S.tls||wkStart(TODAY)};
taskGantt=function(){S.tlv=S.tlv||'2w';const v=S.tlv,pj=S.tlp||'all',pe=S.tlo||'all';
 const all=myTasks(),T=all.filter(t=>(pj==='all'||t.proj===pj)&&(pe==='all'||t.o===pe));
 const people=[...new Set(all.filter(t=>pj==='all'||t.proj===pj).map(t=>t.o))].filter(Boolean).sort((a,b)=>nmF(a).localeCompare(nmF(b)));
 const projs=D.projects.filter(p=>all.some(t=>t.proj===p.id));
 const s=tlFrom(),N=TLV[v],days=Array.from({length:N},(_,i)=>addD(s,i)),e=days[N-1];
 const lab=v==='d'?(s===TODAY?'Today':s===addD(TODAY,1)?'Tomorrow':s===addD(TODAY,-1)?'Yesterday':'')+' · '+new Date(s+'T12:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}):`${fmt(s)} – ${fmtY(e)}`;
 const tools=`<div class="tl-bar"><div class="tl-nav"><button data-a="tlNav" data-n="-1" aria-label="Earlier">‹</button><button class="${v==='d'&&s===TODAY?'on':''}" data-a="tlGo" data-d="0">Today</button><button class="${v==='d'&&s===addD(TODAY,1)?'on':''}" data-a="tlGo" data-d="1">Tomorrow</button><button data-a="tlWeek">This week</button><button data-a="tlNav" data-n="1" aria-label="Later">›</button><label class="tl-pick">📅<input type="date" value="${s}" data-ch="tlPick" aria-label="Go to date"></label></div>
 <b class="tl-rng">${lab}</b><span class="tsp"></span>
 <div class="vsw">${[['d','Day'],['1w','1 week'],['2w','2 weeks'],['m','Month']].map(([k,n])=>`<button class="${v===k?'on':''}" data-a="tlV" data-t="${k}">${n}</button>`).join('')}</div></div>
 <div class="tl-flt"><label>Project<select data-ch="tlP"><option value="all">All projects</option>${projs.map(p=>`<option value="${p.id}" ${pj===p.id?'selected':''}>${h(p.n)}</option>`).join('')}</select></label><label>Person<select data-ch="tlO"><option value="all">Everyone (${people.length})</option>${people.map(k=>`<option value="${k}" ${pe===k?'selected':''}>${h(nmF(k))}</option>`).join('')}</select></label>
 <span class="tl-leg">${KCOL.map(c=>`<span><i style="background:${c[2]}"></i>${c[1]}</span>`).join('')}<span><i class="lt"></i>Late</span></span></div>`;
 const pill=t=>{const c=KCOL.find(x=>x[0]===colOf(t));return `<span class="tl-st" style="--bc:${c[2]}">${c[1]}</span>`};
 const edit=t=>canMove(t)?`<button class="tl-ed" data-a="tlEd" data-id="${t.id}" aria-label="Change dates of ${h(t.t)}">📅</button>`:'';
 if(v==='d'){const L=T.filter(t=>t.st!=='Done'&&tStart(t)<=s&&t.due>=s),late=s===TODAY?T.filter(tLate):[],done=T.filter(t=>t.st==='Done'&&t.due===s);
  const grp={};L.forEach(t=>(grp[t.o]=grp[t.o]||[]).push(t));
  const row=t=>`<div class="tl-li ${tLate(t)?'late':''}"><i class="tl-pc" style="background:${projCol(t.proj)}"></i><button class="tl-nm" data-a="tOpen" data-id="${t.id}"><b>${h(t.t)}</b><span>${h(projN(t.proj)||'No project')} · ${tStart(t)===t.due?'due '+fmt(t.due):fmt(tStart(t))+' → '+fmt(t.due)}${t.pri==='High'?' · <em class="r">High</em>':''}</span></button>${pill(t)}${edit(t)}</div>`;
  return tools+`<div class="tl-day">${late.length?`<div class="tl-sec r"><b>Late (${late.length})</b></div>${late.map(row).join('')}`:''}
  ${Object.keys(grp).sort((a,b)=>nmF(a).localeCompare(nmF(b))).map(k=>`<div class="tl-sec">${av(nm(k),'s')}<b>${h(nmF(k))}</b><span class="xs mut">${grp[k].length} task${grp[k].length>1?'s':''}</span></div>${grp[k].map(row).join('')}`).join('')||empty('Nothing planned for this day','Pick another day or person')}
  ${done.length?`<div class="tl-sec g"><b>Completed (${done.length})</b></div>${done.map(row).join('')}`:''}</div>`}
 const col=d=>dDiff(s,d);
 const groups=(pj==='all'?D.projects.filter(p=>T.some(t=>t.proj===p.id)):D.projects.filter(p=>p.id===pj)).concat(T.some(t=>!D.projects.find(p=>p.id===t.proj))?[{id:'_none',n:'No project'}]:[]);
 const inG=(t,g)=>g.id==='_none'?!D.projects.find(p=>p.id===t.proj):t.proj===g.id;
 const grid=inner=>`<div class="gx-g" style="--n:${N}">${days.map((d,i)=>{const w=new Date(d+'T12:00:00').getDay();return `<i class="gx-c ${w===0?'sun':''} ${d===TODAY?'now':''}" style="grid-column:${i+1}"></i>`}).join('')}${inner}</div>`;
 const bar=t=>{const a=col(tStart(t)),b=col(t.due);if(b<0||a>N-1)return '';const c=KCOL.find(x=>x[0]===colOf(t)),mv=canMove(t);
  return `<div class="gx-b ${mv?'mv':''} ${tLate(t)?'late':''}" data-gid="${t.id}" data-a0="${a}" data-b0="${b}" style="grid-column:${Math.max(0,a)+1}/${Math.min(N-1,b)+2};--bc:${c[2]}" title="${h(t.t)} · ${fmt(tStart(t))} → ${fmt(t.due)}">${mv&&a>=0?'<span class="gx-h l"></span>':''}<span class="gx-bt">${a===b?fmt(t.due):fmt(tStart(t))+' – '+fmt(t.due)}</span>${mv&&b<=N-1?'<span class="gx-h r"></span>':''}</div>`};
 let body='';
 groups.forEach(g=>{const GT=T.filter(t=>inG(t,g)&&col(t.due)>=0&&col(tStart(t))<=N-1).sort((a,b)=>tStart(a).localeCompare(tStart(b)));if(!GT.length)return;
  body+=`<div class="gx-r tl-grp"><div class="gx-l"><i style="background:${projCol(g.id)}"></i><b>${h(g.n)}</b><span class="gx-cnt">${GT.filter(t=>t.st!=='Done').length} open</span></div>${grid('')}</div>`;
  GT.forEach(t=>{body+=`<div class="gx-r gx-task"><div class="gx-l tl-tl">${av(nm(t.o),'s')}<button class="tl-nm" data-a="tOpen" data-id="${t.id}"><b>${h(t.t)}</b><span>${h(nmF(t.o))}${tLate(t)?' · <em class="r">late</em>':tActive(t)?' · <em class="g">on today</em>':''}</span></button>${edit(t)}</div>${grid(bar(t))}</div>`})});
 S.gs=s;
 const hd=`<div class="gx-r gx-hd"><div class="gx-l">Task · owner</div><div class="gx-g" style="--n:${N}">${days.map((d,i)=>{const x=new Date(d+'T12:00:00'),wd=x.getDay();return `<div class="gx-d ${d===TODAY?'now':''} ${wd===0?'sun':''}" style="grid-column:${i+1}">${N<=14?`<small>${x.toLocaleDateString('en-IN',{weekday:'short'})}</small>`:''}${(wd===1||i===0||N<=14)?`<b>${x.getDate()}${wd===1||i===0?' '+x.toLocaleDateString('en-IN',{month:'short'}):''}</b>`:x.getDate()}</div>`}).join('')}</div></div>`;
 return tools+`<div class="gx tlx" style="--n:${N};--cw:${N<=7?110:N<=14?60:30}px"><div class="gx-in">${hd}${body||`<div class="tl-empty">${empty('No tasks in these dates','Change the dates, project or person')}</div>`}</div></div>
 <div class="xs mut" style="margin-top:8px">📅 changes a task's start and due date · you can also drag a bar, or drag its edges · tap a task to open it.</div>`};
A.tlV=e=>{S.tlv=e.dataset.t;if(S.tlv==='d')S.tld=S.tld||TODAY;else S.tls=S.tlv==='m'?TODAY.slice(0,8)+'01':wkStart(S.tld||TODAY);render()};
A.tlGo=e=>{S.tlv='d';S.tld=addD(TODAY,+e.dataset.d);render()};
A.tlWeek=()=>{S.tlv='1w';S.tls=wkStart(TODAY);render()};
A.tlNav=e=>{const n=+e.dataset.n,v=S.tlv||'2w';if(v==='d')S.tld=addD(S.tld||TODAY,n);else S.tls=addD(tlFrom(),n*(v==='m'?28:7));render()};
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ch;if(k==='tlPick'&&e.target.value){if((S.tlv||'2w')==='d')S.tld=e.target.value;else S.tls=(S.tlv==='m'?e.target.value:wkStart(e.target.value));render()}if(k==='tlP'){S.tlp=e.target.value;S.tlo='all';render()}if(k==='tlO'){S.tlo=e.target.value;render()}});
A.tlEd=e=>{const t=D.tasks.find(x=>x.id===e.dataset.id);if(!t)return;const q=(l,a,b)=>`<button class="btn sm sec" data-a="tlQ" data-s="${a}" data-u="${b}">${l}</button>`;
 sheet(`<h2>Change dates</h2><p class="sm"><b>${h(t.t)}</b> · ${h(nmF(t.o))}</p><div class="row" style="gap:8px"><div style="flex:1"><label for="tl-s">Start</label><input id="tl-s" type="date" value="${tStart(t)}"></div><div style="flex:1"><label for="tl-u">Due</label><input id="tl-u" type="date" value="${t.due}"></div></div>
 <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${q('Today',TODAY,TODAY)}${q('Tomorrow',addD(TODAY,1),addD(TODAY,1))}${q('This week',TODAY,addD(wkStart(TODAY),5))}${q('Next week',addD(wkStart(TODAY),7),addD(wkStart(TODAY),12))}${q('+1 week',addD(tStart(t),7),addD(t.due,7))}</div>
 <button class="btn w" style="margin-top:12px" data-a="tlSave" data-id="${t.id}">Save dates</button>`)};
A.tlQ=e=>{const a=document.getElementById('tl-s'),b=document.getElementById('tl-u');if(a)a.value=e.dataset.s;if(b)b.value=e.dataset.u};
A.tlSave=e=>{const t=D.tasks.find(x=>x.id===e.dataset.id);if(!t)return;let s1=val('tl-s'),u1=val('tl-u');if(!s1||!u1)return toast('Pick both dates');if(u1<s1)[s1,u1]=[u1,s1];const s0=tStart(t),u0=t.due;t.start=s1;t.due=u1;(t.log=t.log||[]).push({by:S.me,at:TODAY,x:`Dates changed ${fmt(s0)}–${fmt(u0)} → ${fmt(s1)}–${fmt(u1)}`});save();closeM();render();toast('Dates saved · '+(s1===u1?fmt(u1):fmt(s1)+' → '+fmt(u1)))};

render();
</script></body></html>
