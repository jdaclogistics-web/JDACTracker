<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JDAC — Form</title>
<link rel="icon" href="../icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:radial-gradient(120% 70% at 50% 0%,#2B4BA0,#1B2F6B 45%,#0B1430);min-height:100vh;color:#0F1B3D;padding:28px 16px}
.w{max-width:460px;margin:0 auto}.logo{display:block;width:180px;margin:0 auto 16px}
.c{background:#fff;border-radius:20px;padding:22px 18px;box-shadow:0 20px 50px rgba(4,10,30,.4)}h1{margin:0 0 4px;font-size:21px}p.s{margin:0 0 16px;color:#6B7590;font-size:13.5px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#3A4560;margin-bottom:12px}
input,select,textarea{font:inherit;border:1.5px solid #E1E6F0;border-radius:12px;padding:12px;background:#F4F6FB;color:#0F1B3D}textarea{min-height:90px}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(90deg,#F15A24,#F7782F);cursor:pointer}button:disabled{opacity:.6}
.e{background:#FEF2F2;color:#991B1B;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}.ok{text-align:center;padding:24px 6px}.ok b{display:block;font-size:20px;margin:8px 0}
</style>
</head>
<body><div class="w"><img class="logo" src="../jdac-logo.png" alt="JDAC — The Logistics Aggregator"><div class="c" id="c">Loading…</div></div>
<script>
const API = 'https://jdac-tracker-api.jdaclogistics.workers.dev'
const slug = new URLSearchParams(location.search).get('n') || ''
const c = document.getElementById('c')
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (x) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[x]))
fetch(API + '/api/public/form/' + encodeURIComponent(slug)).then((r) => r.json().then((j) => [r.ok, j])).then(([ok, f]) => {
  if (!ok) { c.innerHTML = '<div class="e">' + esc(f.error || 'Form not found') + '</div>'; return }
  document.title = f.title + ' — JDAC'
  c.innerHTML = `<h1>${esc(f.icon)} ${esc(f.title)}</h1><p class="s">The JDAC team will contact you soon.</p><form id="f">${f.fields.map((q) => `<label>${esc(q.label)}${q.required ? ' *' : ''}${
    q.type === 'choice' ? `<select name="${q.key}" ${q.required ? 'required' : ''}><option value="">—</option>${(q.options || []).map((o) => `<option>${esc(o)}</option>`).join('')}</select>`
    : q.type === 'long' ? `<textarea name="${q.key}" ${q.required ? 'required' : ''}></textarea>`
    : `<input name="${q.key}" type="${{ phone: 'tel', number: 'number', date: 'date' }[q.type] || 'text'}" ${q.type === 'phone' ? 'pattern="[0-9+ ]{10,14}" inputmode="tel"' : ''} ${q.required ? 'required' : ''}>`}</label>`).join('')}<div id="er"></div><button id="b">Submit</button></form>`
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault(); const b = document.getElementById('b'); b.disabled = true; b.textContent = 'Sending…'
    try {
      const r = await fetch(API + '/api/public/form/' + encodeURIComponent(slug), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) })
      const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Error')
      c.innerHTML = '<div class="ok">✅<b>Thank you!</b>Your response has reached JDAC.</div>'
    } catch (er) { document.getElementById('er').innerHTML = '<div class="e">' + esc(er.message) + '</div>'; b.disabled = false; b.textContent = 'Submit' }
  }
}).catch(() => { c.innerHTML = '<div class="e">Check your internet and open again</div>' })
</script>
</body></html>
