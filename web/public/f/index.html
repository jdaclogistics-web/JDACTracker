<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JDAC — Form</title>
<link rel="icon" href="../icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:#F1F3F8;color:#0F1B3D}
.top{height:150px;background:var(--c,#24408E)}.w{max-width:640px;margin:-110px auto 40px;padding:0 14px}
.card{background:#fff;border-radius:16px;padding:20px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(16,24,40,.06)}
.head{border-top:8px solid var(--c,#24408E)}.logo{height:30px;margin-bottom:12px}h1{margin:0 0 6px;font-size:24px;line-height:1.25}.desc{color:#4B5563;white-space:pre-wrap;margin:0}.req{color:#D92D20;font-size:12.5px;margin-top:10px}
.q label.t{display:block;font-weight:700;font-size:15.5px;margin-bottom:4px}.q .h{color:#6B7280;font-size:13px;margin:-2px 0 8px}.q .star{color:#D92D20}
.sec{background:var(--c,#24408E);color:#fff}.sec h2{margin:0;font-size:18px}.sec p{margin:4px 0 0;opacity:.85;font-size:13.5px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;border:0;border-bottom:1.5px solid #D0D5DD;padding:10px 2px;background:transparent;outline:none;color:#0F1B3D}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--c,#24408E)}textarea{min-height:80px;resize:vertical}
.op{display:flex;align-items:center;gap:12px;padding:9px 2px;cursor:pointer}.op input{width:20px;height:20px;accent-color:var(--c,#24408E);flex:none}
.rate{display:flex;gap:8px}.rate label{flex:1}.rate input{display:none}.rate span{display:grid;place-items:center;height:46px;border:1.5px solid #D0D5DD;border-radius:12px;font-size:20px;cursor:pointer}.rate input:checked+span{background:var(--c,#24408E);border-color:var(--c,#24408E);color:#fff}
.yn{display:flex;gap:8px}.yn label{flex:1}.yn input{display:none}.yn span{display:block;text-align:center;padding:11px;border:1.5px solid #D0D5DD;border-radius:12px;font-weight:700;cursor:pointer}.yn input:checked+span{background:var(--c,#24408E);border-color:var(--c,#24408E);color:#fff}
button{border:0;border-radius:12px;padding:14px 26px;font:inherit;font-size:16px;font-weight:800;color:#fff;background:var(--c,#24408E);cursor:pointer}button:disabled{opacity:.6}
.foot{display:flex;justify-content:space-between;align-items:center}.foot small{color:#6B7280}
.e{background:#FEF2F2;color:#991B1B;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}.ok{text-align:center;padding:30px 8px}.ok b{display:block;font-size:22px;margin:10px 0 6px}
.bad{border-left:4px solid #D92D20}
</style>
</head>
<body><div class="top" id="top"></div><div class="w" id="c"><div class="card">Loading…</div></div>
<script>
const API = 'https://jdac-tracker-api.jdaclogistics.workers.dev'
const slug = new URLSearchParams(location.search).get('n') || ''
const c = document.getElementById('c')
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (x) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[x]))
const logo = '<img class="logo" src="../jdac-logo.png" alt="JDAC">'
fetch(API + '/api/public/form/' + encodeURIComponent(slug)).then((r) => r.json().then((j) => [r.ok, j])).then(([ok, f]) => {
  if (!ok) { c.innerHTML = '<div class="card">' + logo + '<div class="e">' + esc(f.error || 'Form not found') + '</div></div>'; return }
  const m = f.meta || {}; document.documentElement.style.setProperty('--c', m.color || '#24408E'); document.title = f.title + ' — JDAC'
  const q = (x) => {
    const n = esc(x.key), r = x.required ? 'required' : '', lab = `<label class="t">${esc(x.label)}${x.required ? ' <span class="star">*</span>' : ''}</label>${x.help ? `<div class="h">${esc(x.help)}</div>` : ''}`
    if (x.type === 'section') return `<div class="card sec"><h2>${esc(x.label)}</h2>${x.help ? `<p>${esc(x.help)}</p>` : ''}</div>`
    let inp
    if (x.type === 'long') inp = `<textarea name="${n}" ${r} placeholder="Your answer"></textarea>`
    else if (x.type === 'choice') inp = `<select name="${n}" ${r}><option value="">Choose</option>${(x.options || []).map((o) => `<option>${esc(o)}</option>`).join('')}</select>`
    else if (x.type === 'radio') inp = (x.options || []).map((o) => `<label class="op"><input type="radio" name="${n}" value="${esc(o)}" ${r}>${esc(o)}</label>`).join('')
    else if (x.type === 'check') inp = (x.options || []).map((o) => `<label class="op"><input type="checkbox" name="${n}" value="${esc(o)}">${esc(o)}</label>`).join('')
    else if (x.type === 'rating') inp = `<div class="rate">${[1, 2, 3, 4, 5].map((v) => `<label><input type="radio" name="${n}" value="${v}" ${r}><span>${'★'.repeat(1)}${v}</span></label>`).join('')}</div>`
    else if (x.type === 'yesno') inp = `<div class="yn">${['Yes', 'No'].map((v) => `<label><input type="radio" name="${n}" value="${v}" ${r}><span>${v}</span></label>`).join('')}</div>`
    else inp = `<input name="${n}" type="${{ phone: 'tel', number: 'number', date: 'date', email: 'email' }[x.type] || 'text'}" ${x.type === 'phone' ? 'pattern="[0-9+ ]{10,14}" inputmode="tel"' : ''} ${r} placeholder="Your answer">`
    return `<div class="card q" data-k="${n}" data-req="${x.required ? 1 : 0}" data-t="${x.type}">${lab}${inp}</div>`
  }
  c.innerHTML = `<div class="card head">${logo}<h1>${esc(f.icon || '')} ${esc(f.title)}</h1>${m.desc ? `<p class="desc">${esc(m.desc)}</p>` : ''}${f.fields.some((x) => x.required) ? '<div class="req">* Required</div>' : ''}</div>
  <form id="f" novalidate>${f.fields.map(q).join('')}<div id="er"></div><div class="foot"><button id="b">Submit</button><small>Secured by JDAC</small></div></form>`
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault(); const b = document.getElementById('b'), er = document.getElementById('er'); er.innerHTML = ''
    const fd = new FormData(e.target), data = {}; let miss = null
    document.querySelectorAll('.q').forEach((el) => {
      const k = el.dataset.k, v = el.dataset.t === 'check' ? fd.getAll(k) : (fd.get(k) || '').toString().trim()
      data[k] = v; const empty = Array.isArray(v) ? !v.length : !v
      el.classList.toggle('bad', el.dataset.req === '1' && empty); if (el.dataset.req === '1' && empty && !miss) miss = el
    })
    if (miss) { er.innerHTML = '<div class="e">Please answer the required questions</div>'; miss.scrollIntoView({ behavior: 'smooth', block: 'center' }); return }
    b.disabled = true; b.textContent = 'Sending…'
    try {
      const r = await fetch(API + '/api/public/form/' + encodeURIComponent(slug), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Error')
      c.innerHTML = `<div class="card head">${logo}<div class="ok">✅<b>Thank you!</b>${esc(m.thanks || 'Your response has reached JDAC.')}</div></div>`; scrollTo(0, 0)
    } catch (x) { er.innerHTML = '<div class="e">' + esc(x.message) + '</div>'; b.disabled = false; b.textContent = 'Submit' }
  }
}).catch(() => { c.innerHTML = '<div class="card"><div class="e">Check your internet and open again</div></div>' })
</script>
</body></html>
